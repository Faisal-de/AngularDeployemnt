trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd novagrid-workspace
    npm install
    npx ng build telemetry-hub --configuration=production --base-href /
  displayName: 'npm install and build telemetry-hub'

- powershell: |
    # Dynamically find the real COMPILED output folder by looking for main.js 
    # This ignores your raw source code because raw source files end in .ts, not .js!
    Write-Host "Locating the true compiled production distribution directory..."
    $compiledOutputFolder = Get-ChildItem -Path . -Filter "main.js" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
    
    if ($compiledOutputFolder) {
        Write-Host "SUCCESS: Found compiled production assets folder at: $compiledOutputFolder"
        # Copy the true compiled .js, .css, and built index.html into the staging zone
        Copy-Item -Path "$compiledOutputFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } else {
        Write-Error "CRITICAL ERROR: Could not find any compiled production assets (main.js is missing)! Ensure the Angular build completed successfully without errors."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'