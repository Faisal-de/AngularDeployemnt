trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd novagrid-workspace
    npm install
    npx ng build telemetry-hub --configuration=production --base-href /
  displayName: 'npm install and build telemetry-hub'

- powershell: |
    Write-Host "Starting automatic build directory discovery..."
    
    # 1. Find every folder containing an index.html file
    $allFolders = Get-ChildItem -Path . -Filter "index.html" -Recurse | Select-Object -ExpandProperty DirectoryName -Unique
    $targetFolder = $null
    
    Write-Host "Folders containing index.html found:"
    foreach ($folder in $allFolders) {
        Write-Host " - Found path: $folder"
        
        # Skip source directories and dependencies
        if ($folder -like "*node_modules*" -or $folder -like "*\src*" -or (Test-Path (Join-Path $folder "main.ts"))) {
            Write-Host "   => Skipping (detected as source code or node_modules)"
            continue
        }
        
        # If it contains an index.html and isn't source code, this is our compiled directory!
        $targetFolder = $folder
        Write-Host "   => Match found! Selected as production build folder."
        break
    }
    
    # 2. Copy the discovered files safely
    if ($targetFolder) {
        Write-Host "Staging assets from: $targetFolder"
        Copy-Item -Path "$targetFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
        Write-Host "SUCCESS: Assets staged successfully."
    } else {
        Write-Error "CRITICAL ERROR: Could not locate a compiled production build directory. Please check your angular.json file for 'outputPath'."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'