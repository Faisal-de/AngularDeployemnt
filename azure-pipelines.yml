trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd novagrid-workspace
    npm install
    npx ng build telemetry-hub --configuration=production --base-href ./
  displayName: 'npm install and build telemetry-hub'

- powershell: |
    # Dynamically find where Angular actually put the index.html file
    $buildFolder = Get-ChildItem -Path . -Filter "index.html" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
    
    if ($buildFolder) {
        Write-Host "Found build output folder at: $buildFolder"
        # Copy the contents directly into the artifact staging area
        Copy-Item -Path "$buildFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } else {
        Write-Error "Could not find the built Angular assets (index.html missing)!"
        exit 1
    }
  displayName: 'Stage built assets safely'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'