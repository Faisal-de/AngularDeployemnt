trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
    npx ng build telemetry-hub-player --configuration=production --base-href /
  displayName: 'npm install and build telemetry-hub-player'

- powershell: |
    # Target the production compilation path directly in the root dist folder
    $targetPath = "dist\telemetry-hub-player\browser"
    $fallbackPath = "dist\telemetry-hub-player"
    
    if (Test-Path $targetPath) {
        Write-Host "SUCCESS: Found compiled directory at $targetPath"
        Copy-Item -Path "$targetPath\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } elseif (Test-Path $fallbackPath) {
        Write-Host "SUCCESS: Found compiled directory at fallback $fallbackPath"
        Copy-Item -Path "$fallbackPath\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } else {
        Write-Error "CRITICAL: Could not locate the Angular distribution build directory inside dist!"
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'