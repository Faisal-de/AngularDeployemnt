trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# STEP 1: Enter the true workspace folder and install dependencies
- script: |
    cd novagrid-workspace
    npm install
  displayName: 'npm install dependencies'

# STEP 2: Enter the true workspace folder and run the pure production build
- script: |
    cd novagrid-workspace
    npx ng build telemetry-hub-player --configuration=production
  displayName: 'Execute Angular Production Build'

# STEP 3: Stage the compiled distribution files directly from the true build directory
- powershell: |
    Write-Host "Locating compiled production assets folder..."
    
    # This matches the exact folder structure verified in your VS Code sidebar
    $productionFolder = "novagrid-workspace\dist\telemetry-hub-player\browser"
    $fallbackFolder = "novagrid-workspace\dist\telemetry-hub-player"
    
    if (Test-Path $productionFolder) {
        Write-Host "SUCCESS: Target build directory found at: $productionFolder"
        Copy-Item -Path "$productionFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } 
    elif (Test-Path $fallbackFolder) {
        Write-Host "SUCCESS: Target fallback directory found at: $fallbackFolder"
        Copy-Item -Path "$fallbackFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } 
    else {
        Write-Error "CRITICAL ERROR: Could not locate the 'dist' folder contents inside novagrid-workspace. Check build output errors above."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'