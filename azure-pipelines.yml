trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: npm install
  displayName: 'npm install dependencies'
  
- script: npx ng build telemetry-hub --configuration=production
  displayName: 'Execute Angular Production Build'

- powershell: |
    Write-Host "Staging the verified compiled files..."
    $productionFolder = "dist\telemetry-hub\browser"
    
    if (Test-Path $productionFolder) {
        Copy-Item -Path "$productionFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
        Write-Host "SUCCESS: Assets staged cleanly!"
    } else {
        Write-Error "CRITICAL ERROR: Build directory missing."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'