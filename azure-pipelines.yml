trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# STEP 1: Install packages directly in the current root folder
- script: npm install
  displayName: 'npm install dependencies'

# STEP 2: Run the build using the exact project name Angular demands ("telemetry-hub")
- script: npx ng build telemetry-hub --configuration=production
  displayName: 'Execute Angular Production Build'

# STEP 3: Stage the compiled distribution files directly from the true build directory
- powershell: |
    Write-Host "Locating compiled production assets folder..."
    
    # Target the exact project name output folder
    $productionFolder = "dist\telemetry-hub\browser"
    $fallbackFolder = "dist\telemetry-hub"
    
    if (Test-Path $productionFolder) {
        Write-Host "SUCCESS: Target build directory found at: $productionFolder"
        Copy-Item -Path "$productionFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } 
    elif (Test-Path $fallbackFolder) {
        Write-Host "SUCCESS: Target fallback directory found at: $fallbackFolder"
        Copy-Item -Path "$fallbackFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } 
    else {
        Write-Error "CRITICAL ERROR: Could not locate the 'dist' folder contents. Check build output errors above."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'