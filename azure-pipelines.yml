trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# STEP 1: Run dependencies installation on its own
- script: npm install
  displayName: 'npm install dependencies'

# STEP 2: Run the Angular compilation independently so it cannot be skipped
- script: npx ng build telemetry-hub-player --configuration=production --base-href /
  displayName: 'Execute Angular Production Build'

# STEP 3: Stage the compiled assets securely
- powershell: |
    Write-Host "Searching for compiled production directory..."
    
    # Check both potential default workspace output variants
    $targetPath = "dist\telemetry-hub-player\browser"
    $fallbackPath = "dist\telemetry-hub-player"
    $novagridTarget = "novagrid-workspace\dist\telemetry-hub-player\browser"
    $novagridFallback = "novagrid-workspace\dist\telemetry-hub-player"
    
    if (Test-Path $targetPath) {
        Write-Host "SUCCESS: Found output at $targetPath"
        Copy-Item -Path "$targetPath\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } elseif (Test-Path $fallbackPath) {
        Write-Host "SUCCESS: Found output at $fallbackPath"
        Copy-Item -Path "$fallbackPath\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } elseif (Test-Path $novagridTarget) {
        Write-Host "SUCCESS: Found output at $novagridTarget"
        Copy-Item -Path "$novagridTarget\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } elseif (Test-Path $novagridFallback) {
        Write-Host "SUCCESS: Found output at $novagridFallback"
        Copy-Item -Path "$novagridFallback\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
    } else {
        Write-Error "CRITICAL: The compiled output folder could not be found anywhere. Check build logs for compilation errors."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'