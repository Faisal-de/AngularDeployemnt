trigger:
- main

pool:
  name: 'Default'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd novagrid-workspace
    npm install
    npx ng build telemetry-hub --configuration=production --base-href /
  displayName: 'npm install and build telemetry-hub'

- powershell: |
    # Force the search strictly inside the compiled production dist directory
    # This prevents accidentally grabbing the raw .ts source code files from the root workspace
    $distPath = "novagrid-workspace\dist"
    
    if (Test-Path $distPath) {
        Write-Host "Searching for compiled production assets inside: $distPath"
        $buildFolder = Get-ChildItem -Path $distPath -Filter "index.html" -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
        
        if ($buildFolder) {
            Write-Host "SUCCESS: Found compiled production assets folder at: $buildFolder"
            # Copy the true compiled .js, .css, and HTML files straight into the staging zone
            Copy-Item -Path "$buildFolder\*" -Destination "$(Build.ArtifactStagingDirectory)" -Recurse -Force
        } else {
            Write-Error "CRITICAL ERROR: Found 'dist' folder, but index.html is missing inside it. Build might have failed."
            exit 1
        }
    } else {
        Write-Error "CRITICAL ERROR: The 'novagrid-workspace\dist' folder does not exist. Check if 'ng build' ran successfully."
        exit 1
    }
  displayName: 'Stage compiled assets strictly'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  displayName: 'Publish Artifacts'